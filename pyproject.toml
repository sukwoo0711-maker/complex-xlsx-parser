[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-xlsx-parser"
version = "0.1.0"
description = "Dependency-free OOXML scene parser for complex XLSX workbooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "sukwoo0711-maker"}]

[project.scripts]
complex-xlsx = "complex_xlsx_parser.cli:main"

[tool.setuptools.packages.find]
include = ["complex_xlsx_parser*"]
